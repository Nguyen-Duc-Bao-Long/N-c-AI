# File ghi công toàn bộ những người tham gia phát triển F.A.T
# và các tài nguyên mặc định được phân phối cùng ứng dụng.
#
# Bao gồm:
# - nhóm phát triển
# - thành viên trong nhóm
# - vai trò từng người
# - AI / Brain / STT / TTS
# - App / Frontend / UI / UX
# - Character / Artist / Live2D
# - Personality / Lore / Narrative
#
# Credits KHÔNG tự động trở thành lore.
# Chỉ những thông tin được lore.yaml xác nhận mới là canon.
# ============================================================

schema_version: 1


# ============================================================
# 1. PROJECT
# ============================================================

project:

  name: "F.A.T"

  type: "Modular AI Desktop Character Platform"

  default_character: "Shu"

  team_name: "GF Team"

  description: >
    F.A.T là một nền tảng AI desktop dạng module,
    cho phép người dùng xây dựng và vận hành các nhân vật AI
    có khả năng tương tác bằng giọng nói và hình ảnh.

    F.A.T hỗ trợ thay thế hoặc import nhiều thành phần độc lập,
    bao gồm character model, Live2D/2D model, STT, Brain,
    LLM, TTS và các dịch vụ AI bên ngoài.

    Các thành phần có thể sử dụng model cục bộ
    hoặc thông qua API của nhà cung cấp bên thứ ba.

    Shu là nhân vật và bộ cấu hình mặc định được cung cấp
    cùng F.A.T, nhưng F.A.T không bị giới hạn chỉ cho Shu.

  credits_policy: >
    File này lưu thông tin ghi công cho toàn bộ cá nhân
    và nhóm tham gia phát triển dự án F.A.T.

    Chỉ ghi những vai trò và đóng góp đã được xác nhận.

    Không tự suy diễn tên thật, quyền sở hữu,
    danh tính hoặc vai trò khác ngoài thông tin đã ghi.

    Thông tin trong credits.yaml không tự động trở thành
    một phần của cốt truyện nhân vật.

    Chỉ những thông tin được lore.yaml xác nhận
    mới được coi là canon của nhân vật.


