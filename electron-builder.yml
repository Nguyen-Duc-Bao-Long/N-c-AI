appId: com.doanh.aidesktopcharacter

productName: F.A.T


directories:
  buildResources: build


files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'

  # F.A.T system resources are copied with extraResources below.
  # Do not package another copy inside app.asar.
  - '!resources/fat/**'
  - '!resources/icon.png'


extraResources:
  # Built-in F.A.T Resource System.
  #
  # Packaged location:
  #   process.resourcesPath/fat
  #
  # This matches:
  #   getSystemResourceRoot()
  - from: resources/fat
    to: fat

  # Master application icon used by BrowserWindow / Tray at runtime.
  #
  # Packaged location:
  #   process.resourcesPath/icon.png
  - from: resources/icon.png
    to: icon.png


win:
  executableName: F.A.T

  # Master source icon for the Windows executable / installer.
  icon: resources/icon.png

  target:
    - nsis


nsis:
  artifactName: F.A.T-${version}-Setup.${ext}

  shortcutName: F.A.T

  uninstallDisplayName: F.A.T

  createDesktopShortcut: always

  createStartMenuShortcut: true


mac:
  icon: resources/icon.png

  entitlementsInherit: build/entitlements.mac.plist

  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.

  notarize: false


dmg:
  artifactName: F.A.T-${version}.${ext}


linux:
  icon: resources/icon.png

  target:
    - AppImage
    - deb

  maintainer: electronjs.org

  category: Utility


appImage:
  artifactName: F.A.T-${version}.${ext}


npmRebuild: false